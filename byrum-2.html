<!DOCTYPE html><html lang='da'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kunsten i Byrummet</title>
<style>
body{font-family:Arial;margin:0;color:#222}.container{max-width:1000px;margin:auto;padding:20px}h1,h2{text-align:center}.intro{text-align:center;line-height:1.6}.slider{position:relative;max-width:971px;height:500px;margin:25px auto;overflow:hidden;border:1px solid #222;background:#fff}.slider img{width:100%;height:100%;object-fit:cover;display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;background:rgba(255,255,255,.85);border:0;cursor:pointer;width:40px;height:55px}.prev{left:10px}.next{right:10px}@media(max-width:700px){.slider{height:auto;aspect-ratio:971/500}}.small{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.small img{width:150px}.text{line-height:1.6}</style></head>
<body><div class='container'><h1>Kunsten i Byrummet</h1><p class='intro'>Sideløbende med afholdelsen af The International Art workshop blev Gludsted med sin deltagelse i projektet Kunsthallen og Landsbyerne en del af Aarhus 2017.</p>
<h2>Nuværende Udendørsværker</h2><div class='small'>
<img src='onewebmedia/Banner%202.webp'><img src='onewebmedia/Borde_b%C3%A6nke%20v.%20Ta%CC%8Arnet.webp'><img src='onewebmedia/B%C3%B8rn%20v.%20Friskole_B%C3%B8rnehuset.webp'><img src='onewebmedia/Ha%CC%8Andtryk%20-%20F%C3%A6llesskab%20v.%20Missionshuset.webp'><img src='onewebmedia/Natur%20ved%20N%C3%B8rretoften.webp'><img src='onewebmedia/gludsted%20vejskilt%20kultur%20sort%20.webp'></div><div id='sliders'></div></div>
<script>
const sliders=[
['Fortællingernes Tårn',['onewebmedia/Gludsted%20ta%CC%8Arnet%20%20kopi.webp','onewebmedia/Ta%CC%8Arn%20i%20m%C3%B8rke.webp','onewebmedia/Fort%C3%A6llingernes%20ta%CC%8Arn%20gra%CC%8Avejr.webp']],
['Ensemble',['onewebmedia/Mette%20tekst%20-1.webp','onewebmedia/IMG_6443.webp','onewebmedia/IMG_6400.webp']],
['MA',['onewebmedia/Ma%CC%8Altegning%20skelet%20.webp','onewebmedia/Mayuko%201.webp','onewebmedia/Mayuko%202.webp']],
['Travelling Island Gludsted',['onewebmedia/DSC_7922___serialized1.webp','onewebmedia/DSC_7925.webp','onewebmedia/DSC_7926.webp']],
['Kunsthallen og Landsbyerne',['onewebmedia/Anne-sofie%20_edited1.webp','onewebmedia/Anne%20sofie%20og%20b%C3%B8rn.webp']],
['Galleri',['onewebmedia/IMG_4306%202.webp','onewebmedia/Mads%20og%20mig%20duo%20%20.webp']]
];
let box=document.getElementById('sliders');
sliders.forEach(s=>{let i=0,d=document.createElement('div');d.innerHTML=`<h2>${s[0]}</h2><div class='slider'><img><button class='arrow prev'>‹</button><button class='arrow next'>›</button></div>`;let im=d.querySelector('img');im.src=s[1][0];d.querySelector('.next').onclick=()=>{i=(i+1)%s[1].length;im.src=s[1][i]};d.querySelector('.prev').onclick=()=>{i=(i-1+s[1].length)%s[1].length;im.src=s[1][i]};box.appendChild(d)});
</script></body></html>
